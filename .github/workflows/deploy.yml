name: Deploy to VPS

# Builds the Docker image on GitHub (not on the small VPS), pushes it to GitHub
# Container Registry, then SSHes into the VPS and restarts the stack in deploy/.
#
# Off until you set the repo variable DEPLOY_ENABLED=true. Setup: deploy/README.md

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build & push image
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        id: img
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/openreply:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${owner}/openreply:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.image }}
            ${{ steps.img.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      DOMAIN: ${{ vars.DOMAIN }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      ALLOWED_EMAILS: ${{ vars.ALLOWED_EMAILS }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
      INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
      FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
      WEBHOOK_VERIFY_TOKEN: ${{ secrets.WEBHOOK_VERIFY_TOKEN }}
      OPENREPLY_IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check configuration
        run: |
          missing=""
          for n in SSH_HOST SSH_USER SSH_PRIVATE_KEY DOMAIN EMAIL_FROM ALLOWED_EMAILS \
                   RESEND_API_KEY INSTAGRAM_APP_ID INSTAGRAM_APP_SECRET \
                   FACEBOOK_APP_SECRET WEBHOOK_VERIFY_TOKEN OPENREPLY_IMAGE; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets/variables:$missing (see deploy/README.md)"
            exit 1
          fi
          case "$DOMAIN" in
            http://*|https://*|*/*) echo "::error::DOMAIN must be a bare host name like reply.example.com"; exit 1 ;;
          esac

      - name: Write app.env
        run: |
          kv() {
            case "$2" in
              *"'"*|*$'\n'*) echo "::error::$1 must not contain a single quote or a newline"; exit 1 ;;
            esac
            printf "%s='%s'\n" "$1" "$2"
          }
          {
            kv NODE_ENV production
            kv OPENREPLY_IMAGE "$OPENREPLY_IMAGE"
            kv DOMAIN "$DOMAIN"
            kv NEXTAUTH_URL "https://$DOMAIN"
            kv REDIS_URL "redis://redis:6379"
            kv RESEND_API_KEY "$RESEND_API_KEY"
            kv EMAIL_FROM "$EMAIL_FROM"
            kv ALLOWED_EMAILS "$ALLOWED_EMAILS"
            kv META_GRAPH_API_VERSION "v25.0"
            kv INSTAGRAM_APP_ID "$INSTAGRAM_APP_ID"
            kv INSTAGRAM_APP_SECRET "$INSTAGRAM_APP_SECRET"
            kv FACEBOOK_APP_SECRET "$FACEBOOK_APP_SECRET"
            kv WEBHOOK_VERIFY_TOKEN "$WEBHOOK_VERIFY_TOKEN"
          } > deploy/app.env
          chmod 600 deploy/app.env

      - name: Set up SSH
        run: |
          port="${SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS not set; trusting the host key seen now (ssh-keyscan)"
            ssh-keyscan -p "$port" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          {
            echo "Host vps"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  Port $port"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 20"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Upload stack files
        run: |
          ssh vps 'mkdir -p ~/openreply && chmod 700 ~/openreply'
          scp deploy/docker-compose.prod.yml deploy/Caddyfile deploy/remote-deploy.sh deploy/app.env vps:openreply/

      - name: Pull image and restart stack
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s\n%s\n' "$GHCR_USER" "$GHCR_TOKEN" | ssh vps 'sh ~/openreply/remote-deploy.sh'

      - name: Smoke test over HTTPS
        run: |
          for i in $(seq 1 18); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 15 "https://$DOMAIN/api/health" || true)
            if [ "$code" = "200" ]; then echo "Healthy:"; cat /tmp/health.json; exit 0; fi
            echo "Attempt $i: HTTP ${code:-none}"
            sleep 10
          done
          echo "::error::https://$DOMAIN/api/health never returned 200. Check DNS A record, firewall ports 80/443, and container logs."
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Remove credentials
        if: always()
        run: rm -f ~/.ssh/id_deploy deploy/app.env
